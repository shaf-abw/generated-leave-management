name: Plan check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify implementation plan
        run: python3 scripts/verify_plan.py docs/implementation-plan.md
      - name: git diff --check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
